name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Task board integrity
        run: python3 tools/agent.py validate
      - name: Bible combat maths
        run: python3 tools/balance_sim.py --check
